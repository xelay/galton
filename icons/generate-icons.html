<!DOCTYPE html>
<html><body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
// This file is just a helper to see what the icon looks like.
// The actual icons are generated via the SVG.
function draw(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width / 192;
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'white';
  ctx.globalAlpha = 0.92;
  const pts = [
    [[96,28],[116,62],[76,62]],
    [[76,72],[96,106],[56,106]],
    [[116,72],[136,106],[96,106]],
    [[56,116],[76,150],[36,150]],
    [[96,116],[116,150],[76,150]],
    [[136,116],[156,150],[116,150]],
  ];
  for (const tri of pts) {
    ctx.beginPath();
    ctx.moveTo(tri[0][0]*s, tri[0][1]*s);
    ctx.lineTo(tri[1][0]*s, tri[1][1]*s);
    ctx.lineTo(tri[2][0]*s, tri[2][1]*s);
    ctx.closePath();
    ctx.fill();
  }
}
draw(document.getElementById('c192'));
draw(document.getElementById('c512'));
</script>
</body></html>
