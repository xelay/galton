<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quincunx">
<meta name="theme-color" content="#080808">
<title>Triangle Quincunx</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#080808;
    overflow:hidden;
    touch-action:none;
    font-family: 'Courier New', monospace;
  }
  #ui {
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:center; gap:14px;
    padding: env(safe-area-inset-top, 10px) 16px 10px;
    padding-top: max(env(safe-area-inset-top, 0px), 10px);
    z-index:10;
    pointer-events:none;
  }
  #btn-new {
    pointer-events:all;
    background:none;
    border:1px solid rgba(255,255,255,0.4);
    color:rgba(255,255,255,0.7);
    font-family: 'Courier New', monospace;
    font-size:12px;
    padding:4px 10px;
    cursor:pointer;
    letter-spacing:0.05em;
    transition: border-color 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
    min-width: 44px;
    min-height: 30px;
  }
  #btn-new:hover { border-color:rgba(255,255,255,0.9); color:#fff; }
  #attempt-label {
    font-size:12px;
    color:rgba(255,255,255,0.45);
    letter-spacing:0.05em;
    pointer-events:none;
    user-select:none;
  }
  #canvas {
    display:block;
    width:100%;
    height:100%;
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="ui">
  <button id="btn-new">new</button>
  <span id="attempt-label">attempt: 1</span>
</div>
<canvas id="canvas"></canvas>

<script>
// =====================================================
// TRIANGLE QUINCUNX
// Minimalist Galton board with triangular pegs
// =====================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const btnNew = document.getElementById('btn-new');
const attemptLabel = document.getElementById('attempt-label');

// CONFIG
const ROWS = 6;
const NUM_BINS = 7;
const TOTAL_BALLS = 3000;
const VIS_BALLS = 150;   // visual animated balls
const GRAVITY = 0.40;
const VISUAL_DURATION = 2400; // ms

// LAYOUT STATE
let W, H;
let FIELD_X, FIELD_Y, FIELD_W, FIELD_H;
let pegAreaTop, pegVSpacing, pegSize;
let binAreaTop, binAreaBottom;

// GAME STATE
let pegs = [];
let bins = [];
let targetBin = 0;
let attemptNum = 1;
let phase = 'setup'; // 'setup' | 'falling' | 'result'
let balls = [];
let resultText = '';
let winEffect = false;
let winTimer = 0;
let winCenter = { x: 0, y: 0 };

// Spawn state
let spawnedVisual = 0;
let fallStartTime = 0;
let simulationDone = false;

// Drag state
let dragPeg = null;
let dragStartX = 0;
let dragStartPegAngle = 0;
let tapStartX = 0;
let tapStartY = 0;

// ---- LAYOUT ----
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  computeLayout();
}

function computeLayout() {
  const uiH = 52;
  FIELD_X = W * 0.04;
  FIELD_W = W * 0.92;
  FIELD_Y = uiH;
  FIELD_H = H - uiH;

  // Zones: top 12% balls cluster, 42% pegs, 46% bins
  pegAreaTop    = FIELD_Y + FIELD_H * 0.13;
  const pegAreaH = FIELD_H * 0.41;
  binAreaTop    = FIELD_Y + FIELD_H * 0.54;
  binAreaBottom = FIELD_Y + FIELD_H * 0.96;

  pegVSpacing = pegAreaH / (ROWS + 0.3);
  pegSize = Math.min(pegVSpacing * 0.40, FIELD_W / (ROWS * 2.0));

  // Rebuild pegs preserving angles
  const oldAngles = {};
  for (const p of pegs) oldAngles[p.row + '_' + p.col] = p.angle;

  pegs = [];
  for (let row = 0; row < ROWS; row++) {
    const numInRow = row + 1;
    const totalWidth = (numInRow - 1) * pegVSpacing * 1.30;
    const startX = W / 2 - totalWidth / 2;
    const y = pegAreaTop + row * pegVSpacing + pegVSpacing * 0.5;
    for (let col = 0; col < numInRow; col++) {
      const x = startX + col * pegVSpacing * 1.30;
      const key = row + '_' + col;
      pegs.push({
        row, col,
        angle: oldAngles[key] !== undefined ? oldAngles[key] : 0,
        cx: x, cy: y,
        size: pegSize
      });
    }
  }

  // Rebuild bins
  bins = [];
  const binW = FIELD_W / NUM_BINS;
  for (let i = 0; i < NUM_BINS; i++) {
    bins.push({
      x: FIELD_X + i * binW,
      w: binW,
      count: 0,
      pct: 0
    });
  }
}

// ---- SIMULATION (fast probabilistic) ----
function runSimulation() {
  const counts = new Array(NUM_BINS).fill(0);
  const pegsByRow = Array.from({ length: ROWS }, () => []);
  for (const p of pegs) pegsByRow[p.row].push(p);

  for (let b = 0; b < TOTAL_BALLS; b++) {
    let xf = 0.5 + (Math.random() - 0.5) * 0.04;

    for (let r = 0; r < ROWS; r++) {
      const rowPegs = pegsByRow[r];
      let nearest = null, nearestDist = Infinity;
      for (const p of rowPegs) {
        const px = (p.cx - FIELD_X) / FIELD_W;
        const d = Math.abs(xf - px);
        if (d < nearestDist) { nearestDist = d; nearest = p; }
      }
      if (!nearest) continue;

      const bias = Math.sin(nearest.angle) * 0.38;
      const goRight = Math.random() < (0.5 - bias);
      const stepSize = 0.5 / (ROWS + 1);
      const jitter = (Math.random() - 0.5) * stepSize * 0.25;
      xf += goRight ? (stepSize + jitter) : (-stepSize + jitter);
      xf = Math.max(0.005, Math.min(0.995, xf));
    }

    const binIndex = Math.min(NUM_BINS - 1, Math.max(0, Math.floor(xf * NUM_BINS)));
    counts[binIndex]++;
  }
  return counts;
}

// ---- BALL ANIMATION ----
function spawnBall() {
  const cx = W / 2;
  const cy = FIELD_Y + FIELD_H * 0.045;
  balls.push({
    x: cx + (Math.random() - 0.5) * 18,
    y: cy + (Math.random() - 0.5) * 10,
    vx: (Math.random() - 0.5) * 2.0,
    vy: Math.random() * 0.8 + 0.2,
    r: 2.6,
    done: false
  });
}

function updateBalls(dt) {
  for (const ball of balls) {
    if (ball.done) continue;
    ball.vy += GRAVITY * dt;
    ball.x  += ball.vx * dt;
    ball.y  += ball.vy * dt;

    for (const p of pegs) {
      const dx = ball.x - p.cx, dy = ball.y - p.cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = p.size * 0.80;
      if (dist < minDist && dist > 0.001) {
        const nx = dx / dist, ny = dy / dist;
        const dot = ball.vx * nx + ball.vy * ny;
        ball.vx = (ball.vx - 2 * dot * nx) * 0.55;
        ball.vy = (ball.vy - 2 * dot * ny) * 0.55;
        ball.vx += Math.sin(p.angle) * -1.5 + (Math.random() - 0.5) * 0.3;
        ball.vy = Math.abs(ball.vy) * 0.6 + 0.5;
        ball.x = p.cx + nx * (minDist + 1);
        ball.y = p.cy + ny * (minDist + 1);
      }
    }

    if (ball.x < FIELD_X + ball.r)            { ball.x = FIELD_X + ball.r; ball.vx = Math.abs(ball.vx) * 0.7; }
    if (ball.x > FIELD_X + FIELD_W - ball.r)  { ball.x = FIELD_X + FIELD_W - ball.r; ball.vx = -Math.abs(ball.vx) * 0.7; }

    if (ball.y > binAreaBottom - 4) ball.done = true;
  }

  for (let i = balls.length - 1; i >= 0; i--) {
    if (balls[i].done) balls.splice(i, 1);
  }
}

// ---- ROUND LOGIC ----
function startNewRound() {
  phase = 'setup';
  targetBin = Math.floor(Math.random() * NUM_BINS);
  bins.forEach(b => { b.count = 0; b.pct = 0; });
  balls = [];
  spawnedVisual = 0;
  fallStartTime = 0;
  simulationDone = false;
  resultText = '';
  winEffect = false;
  winTimer = 0;
  for (const p of pegs) p.angle = 0;
}

function startNewAttempt() {
  phase = 'setup';
  bins.forEach(b => { b.count = 0; b.pct = 0; });
  balls = [];
  spawnedVisual = 0;
  fallStartTime = 0;
  simulationDone = false;
  resultText = '';
  winEffect = false;
  winTimer = 0;
  attemptNum++;
  attemptLabel.textContent = 'attempt: ' + attemptNum;
  // Keep peg angles
}

function launchBalls() {
  if (phase !== 'setup') return;
  phase = 'falling';
  fallStartTime = 0;
  spawnedVisual = 0;
  simulationDone = false;
  balls = [];

  const simCounts = runSimulation();
  const total = simCounts.reduce((a, b) => a + b, 0);
  bins.forEach((b, i) => {
    b.count = simCounts[i];
    b.pct = total > 0 ? simCounts[i] / total : 0;
  });
}

function checkResult() {
  const maxCount = Math.max(...bins.map(b => b.count));
  const win = bins[targetBin].count === maxCount;

  if (win) {
    resultText = 'win';
    winEffect = true;
    winTimer = 0;
    winCenter = { x: bins[targetBin].x + bins[targetBin].w / 2, y: (binAreaTop + binAreaBottom) / 2 };
    setTimeout(() => {
      attemptNum++;
      attemptLabel.textContent = 'attempt: ' + attemptNum;
      startNewRound();
    }, 2400);
  } else {
    resultText = 'try again';
    setTimeout(() => startNewAttempt(), 1800);
  }
}

// ---- DRAWING ----
function drawBg() {
  ctx.fillStyle = '#080808';
  ctx.fillRect(0, 0, W, H);
}

function drawCluster() {
  if (phase !== 'setup') return;
  const cx = W / 2;
  const cy = FIELD_Y + FIELD_H * 0.045;
  // cluster of dots
  ctx.fillStyle = 'rgba(255,255,255,0.82)';
  const pts = [
    [-4,-10],[4,-10],[-8,-3],[0,-5],[8,-3],
    [-6,3],[0,2],[6,3],[-2,9],[4,9],
    [-10,9],[10,8],[2,15],[-5,15],[7,13],
    [-1,-16],[5,-15],[-6,-18],[2,-22],[-3,-22]
  ];
  for (const [dx, dy] of pts) {
    ctx.beginPath();
    ctx.arc(cx + dx, cy + dy, 2.8, 0, Math.PI * 2);
    ctx.fill();
  }
  // tap hint ring
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy + 2, 30, 0, Math.PI * 2);
  ctx.stroke();
}

function drawPegs() {
  for (const p of pegs) {
    ctx.save();
    ctx.translate(p.cx, p.cy);
    ctx.rotate(p.angle);
    const h = p.size;
    const half = p.size * 0.60;
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.70);
    ctx.lineTo(-half, h * 0.50);
    ctx.lineTo( half, h * 0.50);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.90)';
    ctx.fill();
    ctx.restore();
  }
}

function drawBins() {
  const maxCount = Math.max(...bins.map(b => b.count), 1);
  const binH = binAreaBottom - binAreaTop;

  // Fill bars
  if (phase === 'result' || simulationDone) {
    for (let i = 0; i < NUM_BINS; i++) {
      const b = bins[i];
      if (b.count === 0) continue;
      const fillH = (b.count / maxCount) * (binH - 6);
      const isTarget  = i === targetBin;
      const isWinner  = b.count === maxCount;
      let alpha;
      if (isTarget && isWinner) alpha = 0.82;
      else if (isTarget)        alpha = 0.30;
      else                      alpha = 0.16;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fillRect(b.x + 1, binAreaBottom - fillH, b.w - 2, fillH);
    }
  }

  // Dividers
  ctx.strokeStyle = 'rgba(255,255,255,0.50)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= NUM_BINS; i++) {
    const x = FIELD_X + i * (FIELD_W / NUM_BINS);
    ctx.beginPath();
    ctx.moveTo(x, binAreaTop);
    ctx.lineTo(x, binAreaBottom);
    ctx.stroke();
  }

  // Count labels
  if (phase === 'result' || simulationDone) {
    ctx.font = '10px "Courier New"';
    ctx.textAlign = 'center';
    for (let i = 0; i < NUM_BINS; i++) {
      if (bins[i].count > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.32)';
        ctx.fillText(bins[i].count, bins[i].x + bins[i].w / 2, binAreaBottom - 4);
      }
    }
  }

  // Target star below bins
  const tb = bins[targetBin];
  drawStar(tb.x + tb.w / 2, binAreaBottom + 14, 5);

  // Section number labels
  ctx.font = '11px "Courier New"';
  ctx.textAlign = 'center';
  for (let i = 0; i < NUM_BINS; i++) {
    const b = bins[i];
    ctx.fillStyle = i === targetBin ? 'rgba(255,255,255,0.60)' : 'rgba(255,255,255,0.18)';
    ctx.fillText(i + 1, b.x + b.w / 2, binAreaTop - 7);
  }
}

function drawStar(cx, cy, r) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const oa = (i * 4 * Math.PI / 5) - Math.PI / 2;
    const ia = oa + Math.PI / 5;
    if (i === 0) ctx.moveTo(cx + r * Math.cos(oa), cy + r * Math.sin(oa));
    else         ctx.lineTo(cx + r * Math.cos(oa), cy + r * Math.sin(oa));
    ctx.lineTo(cx + r * 0.42 * Math.cos(ia), cy + r * 0.42 * Math.sin(ia));
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBalls() {
  ctx.fillStyle = 'rgba(255,255,255,0.82)';
  for (const b of balls) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawResult() {
  if (!resultText) return;
  ctx.textAlign = 'center';
  if (resultText === 'win') {
    ctx.fillStyle = 'rgba(255,255,255,0.90)';
    ctx.font = 'bold 15px "Courier New"';
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.font = '12px "Courier New"';
  }
  ctx.fillText(resultText, W / 2, FIELD_Y + FIELD_H * 0.49);
}

function drawWinParticles() {
  if (!winEffect) return;
  const t = winTimer;
  const cx = winCenter.x, cy = winCenter.y;
  const count = 28;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + t * 0.5;
    const dist = t * 90 + Math.sin(i) * 20;
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;
    const alpha = Math.max(0, 1 - t * 1.3);
    if (alpha <= 0) continue;
    ctx.fillStyle = `rgba(255,255,255,${alpha * 0.65})`;
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---- GAME LOOP ----
let lastT = 0;
let spawnAccum = 0;

function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min((t - lastT) / 16.67, 3);
  lastT = t;

  // Phase: falling
  if (phase === 'falling') {
    if (!fallStartTime) fallStartTime = t;
    const progress = (t - fallStartTime) / VISUAL_DURATION;

    // Spawn visual balls gradually
    spawnAccum += dt;
    const spawnEvery = (VISUAL_DURATION / 16.67) / VIS_BALLS;
    while (spawnAccum > spawnEvery && spawnedVisual < VIS_BALLS) {
      spawnBall();
      spawnedVisual++;
      spawnAccum -= spawnEvery;
    }

    updateBalls(dt);

    if (progress >= 1 && !simulationDone) {
      simulationDone = true;
      phase = 'result';
      balls = [];
      fallStartTime = 0;
      spawnAccum = 0;
      checkResult();
    }
  }

  if (winEffect) {
    winTimer += dt / 60;
    if (winTimer > 1.6) winEffect = false;
  }

  // Draw
  drawBg();
  drawCluster();
  drawPegs();
  drawBins();
  drawBalls();
  drawWinParticles();
  drawResult();
}

requestAnimationFrame(loop);

// ---- INPUT ----
function getXY(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: src.clientX - rect.left, y: src.clientY - rect.top };
}

function nearestPeg(x, y, maxDist) {
  let best = null, bd = Infinity;
  for (const p of pegs) {
    const d = Math.hypot(p.cx - x, p.cy - y);
    if (d < maxDist && d < bd) { best = p; bd = d; }
  }
  return best;
}

function nearCluster(x, y) {
  const cx = W / 2, cy = FIELD_Y + FIELD_H * 0.045;
  return Math.hypot(x - cx, y - cy) < 44;
}

canvas.addEventListener('mousedown', e => {
  const { x, y } = getXY(e);
  tapStartX = x; tapStartY = y;
  if (nearCluster(x, y)) { launchBalls(); return; }
  if (phase !== 'setup') return;
  dragPeg = nearestPeg(x, y, pegSize * 2.0);
  if (dragPeg) {
    dragStartX = x;
    dragStartPegAngle = dragPeg.angle;
  }
});

canvas.addEventListener('mousemove', e => {
  if (!dragPeg) return;
  const { x } = getXY(e);
  dragPeg.angle = dragStartPegAngle + (x - dragStartX) * 0.028;
});

canvas.addEventListener('mouseup', e => {
  const { x, y } = getXY(e);
  // tap = small movement = toggle 45°
  if (dragPeg && Math.hypot(x - tapStartX, y - tapStartY) < 5) {
    dragPeg.angle += Math.PI / 4;
  }
  dragPeg = null;
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const { x, y } = getXY(e);
  tapStartX = x; tapStartY = y;
  if (nearCluster(x, y)) { launchBalls(); return; }
  if (phase !== 'setup') return;
  dragPeg = nearestPeg(x, y, pegSize * 2.2);
  if (dragPeg) {
    dragStartX = x;
    dragStartPegAngle = dragPeg.angle;
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!dragPeg) return;
  const { x } = getXY(e);
  dragPeg.angle = dragStartPegAngle + (x - dragStartX) * 0.028;
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (!dragPeg) return;
  const touch = e.changedTouches[0];
  const rect = canvas.getBoundingClientRect();
  const x = touch.clientX - rect.left, y = touch.clientY - rect.top;
  if (Math.hypot(x - tapStartX, y - tapStartY) < 8) {
    dragPeg.angle += Math.PI / 4;
  }
  dragPeg = null;
});

btnNew.addEventListener('click', () => {
  attemptNum = 1;
  attemptLabel.textContent = 'attempt: 1';
  startNewRound();
});

window.addEventListener('resize', () => {
  const oldPegAngles = pegs.map(p => p.angle);
  resize();
  // Restore angles after resize
  oldPegAngles.forEach((a, i) => { if (pegs[i]) pegs[i].angle = a; });
});

// SERVICE WORKER
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// INIT
resize();
startNewRound();

// TEST HOOKS
window.render_game_to_text = () => JSON.stringify({
  phase, attempt: attemptNum, targetBin,
  pegAngles: pegs.map(p => +p.angle.toFixed(2)),
  binCounts: bins.map(b => b.count),
  result: resultText
});
window.advanceTime = ms => {
  const steps = Math.round(ms / 16.67);
  for (let i = 0; i < steps; i++) updateBalls(1);
};
</script>
</body>
</html>
