<!DOCTYPE html>
<!-- Helper page: open in browser, right-click canvas, Save as icon-192.png / icon-512.png -->
<html><body style="background:#1a1a2e">
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<button onclick="save('c192','icon-192.png')">Save 192</button>
<button onclick="save('c512','icon-512.png')">Save 512</button>
<script>
function drawIcon(id) {
  const c = document.getElementById(id);
  const s = c.width;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0,0,s,s);
  const cx = s/2, cy = s/2;
  // Triangle
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*0.28);
  ctx.lineTo(cx - s*0.22, cy + s*0.18);
  ctx.lineTo(cx + s*0.22, cy + s*0.18);
  ctx.closePath();
  ctx.fillStyle = '#4a90d9';
  ctx.fill();
  ctx.strokeStyle = '#7ab8f5';
  ctx.lineWidth = s*0.02;
  ctx.stroke();
  // Text
  ctx.fillStyle = '#e94560';
  ctx.font = `bold ${s*0.18}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('Q', cx, cy + s*0.42);
}
function save(id, name) {
  const c = document.getElementById(id);
  const a = document.createElement('a');
  a.download = name;
  a.href = c.toDataURL();
  a.click();
}
drawIcon('c192');
drawIcon('c512');
</script>
</body></html>
